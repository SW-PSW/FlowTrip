<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>여행 코스 공유 게시판</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #222;
        }

        .container {
            width: 1000px;
            margin: 40px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .nav a {
            text-decoration: none;
            color: #333;
            margin-left: 12px;
            font-size: 14px;
        }

        .post-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        .post-title {
            font-size: 20px;
            font-weight: bold;
            color: #111;
            text-decoration: none;
        }

        .meta {
            margin-top: 10px;
            font-size: 13px;
            color: #777;
        }

        .summary {
            margin-top: 14px;
            font-size: 15px;
            color: #444;
            line-height: 1.6;
        }

        .empty {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            color: #777;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 12px;
            margin-right: 6px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="top">
        <h1>여행 코스 공유 게시판</h1>

        <div class="nav">
            <a href="/my-travel">마이페이지</a>
            <a href="/travel">여행 추천</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(posts)}" class="empty">
        아직 공유된 여행 코스가 없습니다.
    </div>

    <div th:each="post : ${posts}" class="post-card">
        <a class="post-title"
           th:href="@{/shared-travel/{id}(id=${post.id})}"
           th:text="${post.title}">
            게시글 제목
        </a>

        <div class="meta">
            <span th:text="${post.user != null ? post.user.username : '알 수 없음'}">작성자</span>
            · 조회수 <span th:text="${post.viewCount}">0</span>
            · <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
        </div>

        <div class="summary">
            <span class="badge"
                  th:if="${post.travelPlan != null && post.travelPlan.selectedThemeName != null}"
                  th:text="${post.travelPlan.selectedThemeName}">
                테마
            </span>

            <span class="badge"
                  th:if="${post.travelPlan != null && post.travelPlan.recommendedPlaceName != null}"
                  th:text="${post.travelPlan.recommendedPlaceName}">
                대표 장소
            </span>

            <p th:text="${post.content}">
                게시글 내용
            </p>
        </div>
    </div>

</div>

</body>
</html>
