<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>FlowTrip - AI 추천 결과</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
            background: #f3f7fb;
            color: #0f172a;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 24px;
        }

        .top-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .top-button {
            height: 72px;
            border: none;
            border-radius: 20px;
            background: white;
            color: #ef4444;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
            transition: 0.15s;
        }

        .top-button:hover {
            transform: translateY(-2px);
            background: #fff5f5;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 7fr 3fr;
            gap: 24px;
            min-height: calc(100vh - 120px);
        }

        .left-zone {
            display: grid;
            grid-template-columns: 86px 1fr;
            gap: 18px;
            min-height: 760px;
        }

        .category-sidebar {
            background: white;
            border-radius: 22px;
            padding: 18px 12px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .category-button {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 16px;
            background: #fef3c7;
            color: #92400e;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.15s;
        }

        .category-button.active {
            background: #facc15;
            color: #422006;
            box-shadow: 0 8px 18px rgba(250, 204, 21, 0.35);
        }

        .category-button:hover {
            transform: translateY(-2px);
        }

        .place-panel {
            background: white;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            min-height: 760px;
        }

        .place-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 12px;
            margin-bottom: 18px;
        }

        .place-panel-header h2 {
            margin: 0;
            font-size: 24px;
        }

        .place-panel-header p {
            margin: 6px 0 0;
            color: #64748b;
            font-size: 14px;
        }

        .place-list {
            height: 660px;
            overflow-y: auto;
            padding-right: 12px;
        }

        .place-list::-webkit-scrollbar {
            width: 10px;
        }

        .place-list::-webkit-scrollbar-track {
            background: #ffedd5;
            border-radius: 999px;
        }

        .place-list::-webkit-scrollbar-thumb {
            background: #fb923c;
            border-radius: 999px;
        }

        .place-card {
            border: 1px solid #dcfce7;
            background: #f0fdf4;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 18px;
            cursor: pointer;
            transition: 0.15s;
        }

        .place-card:hover {
            background: #ecfdf5;
            border-color: #86efac;
            transform: translateY(-2px);
        }

        .place-card strong {
            display: block;
            font-size: 20px;
            margin-bottom: 8px;
            color: #064e3b;
        }

        .place-card p {
            margin: 5px 0;
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
        }

        .image-row {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            overflow-x: auto;
        }

        .place-image {
            width: 120px;
            height: 92px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #bbf7d0;
            background: #e2e8f0;
            flex-shrink: 0;
        }

        .review-box {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #bbf7d0;
        }

        .review-title {
            font-size: 14px;
            font-weight: 900;
            color: #065f46;
            margin-bottom: 8px;
        }

        .review-item {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 14px;
            border: 1px solid #d1fae5;
        }

        .review-item a {
            display: block;
            color: #2563eb;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .review-item a:hover {
            text-decoration: underline;
        }

        .review-desc {
            color: #475569;
            font-size: 13px;
            line-height: 1.45;
        }

        .review-meta {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 6px;
        }

        .right-zone {
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 760px;
        }

        .map-card,
        .recommend-card {
            background: white;
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }

        .map-card {
            height: 390px;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 18px;
            overflow: hidden;
        }

        .recommend-card {
            flex: 1;
            overflow-y: auto;
        }

        .recommend-card h2 {
            margin: 0 0 14px;
            color: #1d4ed8;
        }

        .info-block {
            margin-top: 16px;
        }

        .info-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .info-value {
            color: #0f172a;
            font-size: 15px;
            line-height: 1.65;
            font-weight: 600;
            word-break: keep-all;
        }

        .hidden {
            display: none;
        }

        .debug-card {
            margin-top: 24px;
            background: white;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 14px;
            padding: 18px;
            max-height: 360px;
            overflow-y: auto;
        }

        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .right-zone {
                min-height: auto;
            }

            .map-card {
                height: 460px;
            }
        }

        @media (max-width: 720px) {
            .top-nav {
                grid-template-columns: repeat(2, 1fr);
            }

            .left-zone {
                grid-template-columns: 1fr;
            }

            .category-sidebar {
                flex-direction: row;
                justify-content: center;
            }

            .place-list {
                height: 560px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="top-nav">
        <button type="button" class="top-button">test1</button>
        <button type="button" class="top-button">test2</button>
        <button type="button" class="top-button">test3</button>
        <button type="button" class="top-button">test4</button>
    </div>

    <div class="main-layout">

        <div class="left-zone">

            <div class="category-sidebar">
                <button type="button" class="category-button active" onclick="showCategory('restaurants', this)">
                    식당
                </button>
                <button type="button" class="category-button" onclick="showCategory('cafes', this)">
                    카페
                </button>
                <button type="button" class="category-button" onclick="showCategory('hotels', this)">
                    숙소
                </button>
            </div>

            <div class="place-panel">

                <div class="place-panel-header">
                    <div>
                        <h2>주변 정보</h2>
                        <p>카테고리를 선택하면 해당 장소들이 지도에 표시됩니다.</p>
                    </div>
                </div>

                <div id="restaurants" class="place-list">

                    <div class="place-card"
                         th:each="item : ${restaurantReviews}"
                         th:attr="
                         data-title=${item.place.title},
                         data-mapx=${item.place.mapx},
                         data-mapy=${item.place.mapy}
                         ">

                        <strong th:text="${item.place.title}"></strong>

                        <div class="image-row"
                             th:if="${item.images != null and !item.images.isEmpty()}">
                            <a th:each="image : ${item.images}"
                               th:href="${image.link}"
                               target="_blank"
                               onclick="event.stopPropagation();">
                                <img class="place-image"
                                     th:src="${image.thumbnail}"
                                     th:alt="${image.title}">
                            </a>
                        </div>

                        <p th:text="${item.place.category}"></p>

                        <p th:text="${item.place.roadAddress != null && item.place.roadAddress != '' ? item.place.roadAddress : item.place.address}">
                        </p>

                        <div class="review-box">
                            <div class="review-title">관련 블로그 후기</div>

                            <div th:if="${item.reviews == null or item.reviews.isEmpty()}">
                                <p class="review-desc">관련 후기를 찾지 못했습니다.</p>
                            </div>

                            <div class="review-item" th:each="review : ${item.reviews}">
                                <a th:href="${review.link}"
                                   target="_blank"
                                   onclick="event.stopPropagation();"
                                   th:text="${review.title}">
                                </a>

                                <p class="review-desc" th:text="${review.description}"></p>

                                <p class="review-meta"
                                   th:text="${review.bloggerName + ' · ' + review.postDate}">
                                </p>
                            </div>
                        </div>

                    </div>

                    <p th:if="${restaurantReviews == null or restaurantReviews.isEmpty()}">
                        검색된 식당 정보가 없습니다.
                    </p>
                </div>

                <div id="cafes" class="place-list hidden">

                    <div class="place-card"
                         th:each="place : ${cafes}"
                         th:attr="
                         data-title=${place.title},
                         data-mapx=${place.mapx},
                         data-mapy=${place.mapy}
                         ">

                        <strong th:text="${place.title}"></strong>
                        <p th:text="${place.category}"></p>
                        <p th:text="${place.roadAddress != null && place.roadAddress != '' ? place.roadAddress : place.address}">
                        </p>
                    </div>

                    <p th:if="${cafes == null or cafes.isEmpty()}">
                        검색된 카페 정보가 없습니다.
                    </p>
                </div>

                <div id="hotels" class="place-list hidden">

                    <div class="place-card"
                         th:each="place : ${hotels}"
                         th:attr="
                         data-title=${place.title},
                         data-mapx=${place.mapx},
                         data-mapy=${place.mapy}
                         ">

                        <strong th:text="${place.title}"></strong>
                        <p th:text="${place.category}"></p>
                        <p th:text="${place.roadAddress != null && place.roadAddress != '' ? place.roadAddress : place.address}">
                        </p>
                    </div>

                    <p th:if="${hotels == null or hotels.isEmpty()}">
                        검색된 숙소 정보가 없습니다.
                    </p>
                </div>

            </div>
        </div>

        <div class="right-zone">

            <div class="map-card">
                <div id="map"></div>
            </div>

            <div class="recommend-card">

                <h2 th:text="${recommendationResult != null ? recommendationResult.recommendedPlaceName : '추천 여행지'}">
                    추천 여행지
                </h2>

                <div class="info-block">
                    <div class="info-label">추천 테마</div>
                    <div class="info-value"
                         th:text="${recommendationResult != null ? recommendationResult.selectedThemeName : '-'}">
                    </div>
                </div>

                <div class="info-block">
                    <div class="info-label">추천 이유</div>
                    <div class="info-value"
                         th:text="${recommendationResult != null ? recommendationResult.reason : '-'}">
                    </div>
                </div>

                <div class="info-block">
                    <div class="info-label">주의사항</div>
                    <div class="info-value"
                         th:text="${recommendationResult != null ? recommendationResult.caution : '-'}">
                    </div>
                </div>

                <div class="info-block">
                    <div class="info-label">대체 장소</div>
                    <div class="info-value"
                         th:text="${recommendationResult != null ? recommendationResult.alternativePlaceName : '-'}">
                    </div>
                </div>

                <div class="info-block">
                    <div class="info-label">네이버 검색 기준어</div>
                    <div class="info-value" th:text="${naverSearchBaseQuery}"></div>
                </div>

                <div id="targetPlaceData"
                     th:if="${targetPlaces != null and !targetPlaces.isEmpty()}"
                     th:attr="
                     data-title=${targetPlaces[0].title},
                     data-mapx=${targetPlaces[0].mapx},
                     data-mapy=${targetPlaces[0].mapy}
                     ">
                </div>

            </div>

        </div>

    </div>

    <div class="debug-card">
        <h3>AI 원본 응답</h3>
        <pre th:text="${gptResult}"></pre>
    </div>

</div>

<script th:src="@{'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverMapClientId}}"></script>

<script>
    let map;

    let mainMarker = null;
    let mainInfoWindow = null;

    let categoryMarkers = [];
    let categoryInfoWindows = [];

    window.onload = function () {
        const target = document.getElementById('targetPlaceData');

        if (!target) {
            console.log("targetPlaceData 없음");
            return;
        }

        const title = target.getAttribute('data-title');
        const mapx = target.getAttribute('data-mapx');
        const mapy = target.getAttribute('data-mapy');

        const mainPosition = toLatLng(mapx, mapy);

        map = new naver.maps.Map('map', {
            center: mainPosition,
            zoom: 15
        });

        drawMainMarker(title, mainPosition);
        drawCategoryMarkers('restaurants');
    };

    function toLatLng(mapx, mapy) {
        const lng = Number(mapx) / 10000000;
        const lat = Number(mapy) / 10000000;

        return new naver.maps.LatLng(lat, lng);
    }

    function drawMainMarker(title, position) {
        mainMarker = new naver.maps.Marker({
            position: position,
            map: map,
            title: title
        });

        mainInfoWindow = new naver.maps.InfoWindow({
            content:
                '<div style="padding:10px;font-size:14px;font-weight:800;white-space:nowrap;">'
                + title +
                '</div>'
        });

        mainInfoWindow.open(map, mainMarker);
    }

    function clearCategoryMarkers() {
        categoryMarkers.forEach(marker => marker.setMap(null));
        categoryInfoWindows.forEach(infoWindow => infoWindow.close());

        categoryMarkers = [];
        categoryInfoWindows = [];
    }

    function drawCategoryMarkers(categoryId) {
        clearCategoryMarkers();

        const cards = document.querySelectorAll('#' + categoryId + ' .place-card');

        cards.forEach(card => {
            const title = card.getAttribute('data-title');
            const mapx = card.getAttribute('data-mapx');
            const mapy = card.getAttribute('data-mapy');

            if (!mapx || !mapy) {
                return;
            }

            const position = toLatLng(mapx, mapy);

            const marker = new naver.maps.Marker({
                position: position,
                map: map,
                title: title
            });

            const infoWindow = new naver.maps.InfoWindow({
                content:
                    '<div style="padding:10px;font-size:14px;font-weight:700;white-space:nowrap;">'
                    + title +
                    '</div>'
            });

            naver.maps.Event.addListener(marker, 'click', function () {
                infoWindow.open(map, marker);
            });

            categoryMarkers.push(marker);
            categoryInfoWindows.push(infoWindow);
        });

        if (mainMarker) {
            map.setCenter(mainMarker.getPosition());
            map.setZoom(15);
        }
    }

    function showCategory(categoryId, button) {
        document.querySelectorAll('.place-list')
            .forEach(list => list.classList.add('hidden'));

        document.getElementById(categoryId)
            .classList.remove('hidden');

        document.querySelectorAll('.category-button')
            .forEach(btn => btn.classList.remove('active'));

        button.classList.add('active');

        drawCategoryMarkers(categoryId);
    }
</script>

</body>
</html>
