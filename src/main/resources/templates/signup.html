<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FlowTrip - 회원가입</title>
</head>
<body>
<h1>회원가입</h1>

<p th:if="${signupError}" th:text="${signupError}"></p>

<form method="post" th:action="@{/signup}" th:object="${signupRequestDto}">
    <div>
        <label>아이디</label>
        <input type="text" th:field="*{username}">
        <p th:errors="*{username}"></p>
    </div>

    <div>
        <label>비밀번호</label>
        <input type="password" th:field="*{password}">
        <p th:errors="*{password}"></p>
    </div>

    <div>
        <label>닉네임</label>
        <input type="text" th:field="*{nickname}">
        <p th:errors="*{nickname}"></p>
    </div>

    <button type="submit">회원가입</button>
</form>

<a href="/login">로그인</a>
<a href="/">메인으로</a>
</body>
</html>
