<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FlowTrip - 여행 코스 공유하기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * { box-sizing: border-box; }

        :root {
            --glass-dark: rgba(12, 18, 18, 0.54);
            --line: rgba(255, 255, 255, 0.14);
            --text: #f8fafc;
            --muted: rgba(248, 250, 252, 0.68);
            --dim: rgba(248, 250, 252, 0.45);
            --gold: #f6c65b;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
            color: var(--text);
            background:
                    linear-gradient(90deg, rgba(3, 9, 11, 0.82), rgba(3, 9, 11, 0.34), rgba(3, 9, 11, 0.62)),
                    url("/images/main-bg.jpg") center / cover no-repeat fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(circle at 75% 20%, rgba(246, 198, 91, 0.16), transparent 32%),
                    radial-gradient(circle at 18% 20%, rgba(67, 154, 181, 0.20), transparent 34%),
                    rgba(0, 0, 0, 0.12);
            pointer-events: none;
            z-index: -1;
        }

        a { color: inherit; text-decoration: none; }
        button, input, textarea { font-family: inherit; }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 254px 1fr;
        }

        .sidebar {
            position: sticky;
            top: 0;
            min-height: 100vh;
            height: 100vh;
            padding: 28px 0;
            background: rgba(7, 18, 22, 0.52);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .brand {
            padding: 0 30px 32px;
            display: flex;
            align-items: center;
            gap: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.12);
            font-size: 24px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.7px;
        }

        .brand-sub {
            margin-top: 3px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
        }

        .side-menu {
            padding: 22px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .side-item {
            position: relative;
            height: 74px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--dim);
            font-size: 17px;
            font-weight: 700;
        }

        .side-item.active {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .side-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--gold);
            box-shadow: 0 0 18px rgba(246, 198, 91, 0.7);
        }

        .side-icon {
            width: 28px;
            text-align: center;
            font-size: 25px;
        }

        .content {
            padding: 44px 56px;
        }

        .page-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: -0.9px;
        }

        .desc {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
        }

        .share-grid {
            display: grid;
            grid-template-columns: minmax(360px, 0.8fr) minmax(480px, 1.2fr);
            gap: 28px;
            align-items: start;
        }

        .glass-panel {
            border-radius: 28px;
            padding: 26px;
            background: var(--glass-dark);
            border: 1px solid var(--line);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        }

        .section-title {
            margin: 0 0 18px;
            font-size: 24px;
            font-weight: 950;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: var(--text);
            font-size: 14px;
            font-weight: 900;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 14px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
            outline: none;
            font-size: 15px;
        }

        textarea {
            min-height: 230px;
            resize: vertical;
            line-height: 1.65;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--dim);
        }

        .btn-area {
            margin-top: 24px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .primary-btn,
        .outline-link {
            height: 46px;
            padding: 0 18px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 950;
            cursor: pointer;
        }

        .primary-btn {
            border: none;
            color: #1e1606;
            background: linear-gradient(135deg, #f8d982, #dca73c);
            box-shadow: 0 14px 28px rgba(246, 198, 91, 0.18);
        }

        .outline-link {
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.07);
        }

        .summary-box {
            display: grid;
            gap: 10px;
            padding: 18px;
            margin-bottom: 22px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
        }

        .summary-box b {
            color: var(--text);
            margin-right: 6px;
        }

        .day-block {
            margin-top: 22px;
        }

        .day-title {
            margin: 0 0 12px;
            color: var(--gold);
            font-size: 18px;
            font-weight: 950;
        }

        .preview-item {
            padding: 14px;
            border-radius: 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09);
            margin-bottom: 10px;
        }

        .place-name {
            font-size: 16px;
            font-weight: 950;
            margin-bottom: 6px;
        }

        .small {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .empty {
            border-radius: 22px;
            padding: 28px;
            background: rgba(255,255,255,0.05);
            border: 1px dashed rgba(255,255,255,0.2);
            color: var(--muted);
            line-height: 1.7;
            text-align: center;
        }

        @media (max-width: 1280px) {
            .app { grid-template-columns: 220px 1fr; }
            .content { padding: 34px; }
            .share-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 760px) {
            .app { display: block; }
            .sidebar { position: static; min-height: auto; height: auto; }
            .side-menu { display: none; }
            .content { padding: 24px; }
            .page-head { display: block; }
        }
    </style>
</head>

<body>

<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">✦</div>
            <div>
                <div class="brand-title">FlowTrip</div>
                <div class="brand-sub">AI 여행 추천 서비스</div>
            </div>
        </div>

        <nav class="side-menu">
            <a href="/travel-result/latest" class="side-item">
                <span class="side-icon">✦</span>
                <span>최근 추천</span>
            </a>
            <a href="/my-travel" class="side-item">
                <span class="side-icon">♡</span>
                <span>나의 여행</span>
            </a>
            <a href="/shared-travel" class="side-item active">
                <span class="side-icon">☷</span>
                <span>공유 게시판</span>
            </a>
        </nav>
    </aside>

    <main class="content">
        <div class="page-head">
            <div>
                <div class="eyebrow">SHARE COURSE</div>
                <h1>여행 코스 공유하기</h1>
                <p class="desc">
                    마이페이지에 저장된 코스를 공유하고, 코스 안의 지역 정보로 강원 테마 뱃지를 쌓아갑니다.
                </p>
            </div>
        </div>

        <div class="share-grid">
            <section class="glass-panel">
                <h2 class="section-title">공유 글 작성</h2>

                <form th:action="@{/my-travel/{id}/share(id=${travelPlan.id})}" method="post">
                    <label for="title">게시글 제목</label>
                    <input type="text"
                           id="title"
                           name="title"
                           th:value="${travelPlan.title}"
                           required>

                    <label for="content">공유 내용</label>
                    <textarea id="content"
                              name="content"
                              placeholder="이 여행 코스를 추천하는 이유, 일정 특징, 주의할 점 등을 적어주세요."
                              required></textarea>

                    <div class="btn-area">
                        <button type="submit" class="primary-btn">공유하기</button>
                        <a class="outline-link" th:href="@{/my-travel/{id}(id=${travelPlan.id})}">취소</a>
                    </div>
                </form>
            </section>

            <section class="glass-panel">
                <h2 class="section-title">공유될 코스 미리보기</h2>

                <div class="summary-box">
                    <div>
                        <b>여행 제목</b>
                        <span th:text="${travelPlan.title}">나의 여행</span>
                    </div>
                    <div>
                        <b>추천 테마</b>
                        <span th:text="${travelPlan.selectedThemeName != null and travelPlan.selectedThemeName != '' ? travelPlan.selectedThemeName : '-'}">테마</span>
                    </div>
                    <div>
                        <b>대표 장소</b>
                        <span th:text="${travelPlan.recommendedPlaceName != null and travelPlan.recommendedPlaceName != '' ? travelPlan.recommendedPlaceName : '-'}">대표 장소</span>
                    </div>
                </div>

                <div th:if="${courseItems == null or courseItems.isEmpty()}" class="empty">
                    저장된 코스가 없습니다.
                </div>

                <div th:if="${courseItems != null and !courseItems.isEmpty()}">
                    <div th:each="day : ${#numbers.sequence(1, dayCount)}"
                         class="day-block">
                        <h3 class="day-title" th:text="'DAY ' + ${day}">DAY 1</h3>

                        <div th:each="item : ${courseItems}"
                             th:if="${(item.dayIndex == null and day == 1) or item.dayIndex == day}"
                             class="preview-item">
                            <div class="place-name">
                                <span th:text="${item.courseOrder}">1</span>.
                                <span th:text="${item.placeName}">장소명</span>
                            </div>
                            <div class="small" th:text="${item.address}">주소</div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>

</body>
</html>
