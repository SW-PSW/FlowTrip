<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공유 여행 코스 상세</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #222;
        }

        .container {
            width: 1000px;
            margin: 40px auto;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .title {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .meta {
            color: #777;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .content {
            line-height: 1.8;
            white-space: pre-line;
            font-size: 16px;
        }

        .plan-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 18px;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
        }

        .label {
            font-size: 13px;
            color: #777;
            margin-bottom: 6px;
        }

        .value {
            font-weight: bold;
        }

        .course-item {
            display: flex;
            gap: 16px;
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .course-item:last-child {
            border-bottom: none;
        }

        .thumb {
            width: 120px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            background: #e5e7eb;
        }

        .place-name {
            font-size: 18px;
            font-weight: bold;
        }

        .category {
            color: #4f46e5;
            font-size: 13px;
            margin-top: 4px;
        }

        .address {
            color: #555;
            margin-top: 8px;
            font-size: 14px;
        }

        .memo {
            color: #666;
            margin-top: 8px;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-bottom: 16px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">

    <a class="back" href="/shared-travel">← 공유 게시판으로 돌아가기</a>

    <div class="card">
        <div class="title" th:text="${post.title}">공유글 제목</div>

        <div class="meta">
            작성자
            <span th:text="${post.user != null ? post.user.username : '알 수 없음'}">작성자</span>
            · 조회수 <span th:text="${post.viewCount}">0</span>
            · <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
        </div>

        <div class="content" th:text="${post.content}">
            공유글 내용
        </div>
    </div>

    <div class="card">
        <h2>여행 정보</h2>

        <div class="plan-info">
            <div class="info-box">
                <div class="label">여행 제목</div>
                <div class="value" th:text="${travelPlan.title}">나의 여행</div>
            </div>

            <div class="info-box">
                <div class="label">기간</div>
                <div class="value">
                    <span th:text="${travelPlan.startDate}">시작일</span>
                    ~
                    <span th:text="${travelPlan.endDate}">종료일</span>
                </div>
            </div>

            <div class="info-box">
                <div class="label">이동수단</div>
                <div class="value" th:text="${travelPlan.transport}">자가용</div>
            </div>

            <div class="info-box">
                <div class="label">동행</div>
                <div class="value" th:text="${travelPlan.companion}">친구</div>
            </div>

            <div class="info-box">
                <div class="label">추천 테마</div>
                <div class="value" th:text="${travelPlan.selectedThemeName}">테마</div>
            </div>

            <div class="info-box">
                <div class="label">대표 추천 장소</div>
                <div class="value" th:text="${travelPlan.recommendedPlaceName}">대표 장소</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>공유된 여행 코스</h2>

        <div th:if="${#lists.isEmpty(courseItems)}">
            저장된 코스가 없습니다.
        </div>

        <div th:each="item : ${courseItems}" class="course-item">
            <img class="thumb"
                 th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}"
                 th:src="${item.imageUrl}"
                 alt="장소 이미지">

            <div>
                <div class="place-name">
                    Day <span th:text="${item.dayIndex}">1</span>
                    -
                    <span th:text="${item.courseOrder}">1</span>.
                    <span th:text="${item.placeName}">장소명</span>
                </div>

                <div class="category" th:text="${item.category}">카테고리</div>

                <div class="address" th:text="${item.address}">주소</div>

                <div class="memo"
                     th:if="${item.memo != null and !#strings.isEmpty(item.memo)}"
                     th:text="${item.memo}">
                    메모
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
