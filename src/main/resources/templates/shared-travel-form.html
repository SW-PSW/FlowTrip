<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>여행 코스 공유하기</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #222;
        }

        .container {
            width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
        }

        textarea {
            height: 220px;
            resize: vertical;
        }

        .btn-area {
            margin-top: 24px;
            display: flex;
            gap: 10px;
        }

        button, a.btn {
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #4f46e5;
            color: white;
        }

        a.btn {
            background: #e5e7eb;
            color: #222;
        }

        .preview-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .preview-item:last-child {
            border-bottom: none;
        }

        .small {
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">
        <h1>여행 코스 공유하기</h1>

        <p class="small">
            마이페이지에 저장된 여행 코스를 공유 게시판에 올립니다.
        </p>

        <form th:action="@{/my-travel/{id}/share(id=${travelPlan.id})}" method="post">

            <label for="title">게시글 제목</label>
            <input type="text"
                   id="title"
                   name="title"
                   th:value="${travelPlan.title}"
                   required>

            <label for="content">공유 내용</label>
            <textarea id="content"
                      name="content"
                      placeholder="이 여행 코스를 추천하는 이유, 일정 특징, 주의할 점 등을 적어주세요."
                      required></textarea>

            <div class="btn-area">
                <button type="submit">공유하기</button>
                <a class="btn" th:href="@{/my-travel/{id}(id=${travelPlan.id})}">취소</a>
            </div>

        </form>
    </div>

    <div class="card">
        <h2>공유될 여행 코스 미리보기</h2>

        <p>
            <strong>여행 제목:</strong>
            <span th:text="${travelPlan.title}">나의 여행</span>
        </p>

        <p>
            <strong>추천 테마:</strong>
            <span th:text="${travelPlan.selectedThemeName}">테마</span>
        </p>

        <p>
            <strong>대표 장소:</strong>
            <span th:text="${travelPlan.recommendedPlaceName}">대표 장소</span>
        </p>

        <div th:if="${#lists.isEmpty(courseItems)}">
            저장된 코스가 없습니다.
        </div>

        <div th:each="item : ${courseItems}" class="preview-item">
            <strong>
                Day <span th:text="${item.dayIndex}">1</span>
                -
                <span th:text="${item.courseOrder}">1</span>.
                <span th:text="${item.placeName}">장소명</span>
            </strong>
            <div class="small" th:text="${item.address}">주소</div>
        </div>
    </div>

</div>

</body>
</html>
