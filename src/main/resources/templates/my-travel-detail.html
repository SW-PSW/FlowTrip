<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FlowTrip - 여행 코스 상세</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * { box-sizing: border-box; }

        :root {
            --glass-dark: rgba(12, 18, 18, 0.54);
            --line: rgba(255, 255, 255, 0.14);
            --text: #f8fafc;
            --muted: rgba(248, 250, 252, 0.68);
            --dim: rgba(248, 250, 252, 0.45);
            --gold: #f6c65b;
            --danger: #ff6b6b;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
            color: var(--text);
            background:
                    linear-gradient(90deg, rgba(3, 9, 11, 0.82), rgba(3, 9, 11, 0.34), rgba(3, 9, 11, 0.62)),
                    url("/images/main-bg.jpg") center / cover no-repeat fixed;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 254px 1fr;
        }

        .sidebar {
            min-height: 100vh;
            padding: 28px 0;
            background: rgba(7, 18, 22, 0.52);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .brand {
            padding: 0 30px 32px;
            display: flex;
            align-items: center;
            gap: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.12);
            font-size: 24px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 900;
        }

        .brand-sub {
            margin-top: 3px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
        }

        .side-menu {
            padding: 22px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .side-item {
            position: relative;
            height: 74px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--dim);
            font-size: 17px;
            font-weight: 700;
        }

        .side-item.active {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .side-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--gold);
        }

        .side-icon {
            width: 28px;
            text-align: center;
            font-size: 25px;
        }

        .content {
            padding: 44px 56px;
        }

        .page-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: -0.9px;
        }

        .desc {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
        }

        .head-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .primary-link,
        .outline-link,
        .danger-btn {
            height: 46px;
            padding: 0 18px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 950;
            cursor: pointer;
            border: none;
        }

        .primary-link {
            color: #1e1606;
            background: linear-gradient(135deg, #f8d982, #dca73c);
        }

        .outline-link {
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.07);
        }

        .danger-btn {
            color: #ff9c9c;
            border: 1px solid rgba(255, 107, 107, 0.3);
            background: rgba(255, 107, 107, 0.1);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: minmax(430px, 0.85fr) minmax(520px, 1.15fr);
            gap: 28px;
            align-items: stretch;
        }

        .glass-panel {
            background: var(--glass-dark);
            border: 1px solid var(--line);
            border-radius: 30px;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        }

        .course-panel,
        .map-panel {
            padding: 28px;
            min-height: 640px;
        }

        .section-title {
            margin: 0 0 18px;
            font-size: 24px;
            font-weight: 950;
        }

        .plan-summary {
            display: grid;
            gap: 10px;
            padding: 18px;
            margin-bottom: 22px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
        }

        .summary-row b {
            color: var(--text);
            margin-right: 6px;
        }

        .day-block {
            margin-top: 22px;
        }

        .day-title {
            margin: 0 0 12px;
            color: var(--gold);
            font-size: 18px;
            font-weight: 950;
        }

        .course-list {
            display: grid;
            gap: 14px;
        }

        .course-item {
            display: grid;
            grid-template-columns: 42px 88px 1fr;
            gap: 16px;
            align-items: center;
            padding: 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09);
            cursor: pointer;
            transition: 0.16s ease;
        }

        .course-item:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.075);
            border-color: rgba(246, 198, 91, 0.24);
        }

        .course-order {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #1e1606;
            background: linear-gradient(135deg, #f8d982, #dca73c);
            font-weight: 950;
            font-size: 14px;
        }

        .thumb {
            width: 88px;
            height: 70px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255,255,255,0.12);
            display: grid;
            place-items: center;
            color: rgba(255,255,255,0.55);
            font-size: 28px;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .place-name {
            font-size: 17px;
            font-weight: 950;
            margin-bottom: 7px;
        }

        .place-meta {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
            font-weight: 650;
        }

        .empty {
            border-radius: 22px;
            padding: 28px;
            background: rgba(255,255,255,0.05);
            border: 1px dashed rgba(255,255,255,0.2);
            color: var(--muted);
            line-height: 1.7;
            text-align: center;
        }

        #map {
            width: 100%;
            height: calc(100% - 48px);
            min-height: 560px;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255,255,255,0.14);
        }

        @media (max-width: 1280px) {
            .app {
                grid-template-columns: 220px 1fr;
            }

            .content {
                padding: 34px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            #map {
                min-height: 420px;
            }
        }

        @media (max-width: 760px) {
            .app {
                display: block;
            }

            .sidebar {
                min-height: auto;
            }

            .side-menu {
                display: none;
            }

            .content {
                padding: 24px;
            }

            .page-head {
                display: block;
            }

            .head-actions {
                margin-top: 20px;
                flex-wrap: wrap;
            }

            .course-item {
                grid-template-columns: 38px 1fr;
            }

            .thumb {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">✦</div>
            <div>
                <div class="brand-title">FlowTrip</div>
                <div class="brand-sub">AI 여행 추천 서비스</div>
            </div>
        </div>

        <nav class="side-menu">
            <a href="/" class="side-item">
                <span class="side-icon">✦</span>
                <span>여행 추천</span>
            </a>

            <a href="/my-travel" class="side-item active">
                <span class="side-icon">♡</span>
                <span>나의 여행</span>
            </a>
        </nav>
    </aside>

    <main class="content">

        <div class="page-head">
            <div>
                <div class="eyebrow">MY COURSE DETAIL</div>

                <h1 th:text="${travelPlan.title != null and travelPlan.title != '' ? travelPlan.title : '나의 여행 코스'}">
                    나의 여행 코스
                </h1>

                <p class="desc">
                    저장한 여행 코스를 지도와 함께 다시 확인할 수 있습니다.
                </p>
            </div>

            <div class="head-actions">
                <a class="outline-link" href="/my-travel">목록으로</a>
                <a class="primary-link" href="/">새 추천 받기</a>

                <form th:action="@{/my-travel/{id}/delete(id=${travelPlan.id})}"
                      method="post"
                      onsubmit="return confirm('이 여행 코스를 삭제할까요?');">
                    <button type="submit" class="danger-btn">삭제</button>
                </form>
            </div>
        </div>

        <div class="detail-grid">

            <section class="glass-panel course-panel">

                <h2 class="section-title">여행 코스</h2>

                <div class="plan-summary">
                    <div class="summary-row">
                        <b>기간</b>
                        <span th:text="${travelPlan.startDate != null ? #temporals.format(travelPlan.startDate, 'yyyy.MM.dd') : '-'}"></span>
                        ~
                        <span th:text="${travelPlan.endDate != null ? #temporals.format(travelPlan.endDate, 'yyyy.MM.dd') : '-'}"></span>
                    </div>

                    <div class="summary-row">
                        <b>추천 테마</b>
                        <span th:text="${travelPlan.selectedThemeName != null and travelPlan.selectedThemeName != '' ? travelPlan.selectedThemeName : '-'}"></span>
                    </div>

                    <div class="summary-row">
                        <b>대표 여행지</b>
                        <span th:text="${travelPlan.recommendedPlaceName != null and travelPlan.recommendedPlaceName != '' ? travelPlan.recommendedPlaceName : '-'}"></span>
                    </div>

                    <div class="summary-row">
                        <b>동행 / 이동</b>
                        <span th:text="${travelPlan.companion != null and travelPlan.companion != '' ? travelPlan.companion : '-'}"></span>
                        ·
                        <span th:text="${travelPlan.transport != null and travelPlan.transport != '' ? travelPlan.transport : '-'}"></span>
                    </div>

                    <div class="summary-row">
                        <b>메모</b>
                        <span th:text="${travelPlan.memo != null and travelPlan.memo != '' ? travelPlan.memo : '저장된 여행 코스입니다.'}"></span>
                    </div>
                </div>

                <div th:if="${courseItems == null or courseItems.isEmpty()}" class="empty">
                    저장된 코스 장소가 없습니다.
                </div>

                <div th:if="${courseItems != null and !courseItems.isEmpty()}">

                    <div class="day-block">
                        <h3 class="day-title">DAY 1</h3>

                        <div class="course-list">
                            <div class="course-item"
                                 th:each="item, stat : ${courseItems}"
                                 th:if="${item.dayIndex == null or item.dayIndex == 1}"
                                 th:attr="
                                 data-title=${item.placeName},
                                 data-mapx=${item.mapx},
                                 data-mapy=${item.mapy},
                                 data-order=${item.courseOrder}
                                 "
                                 onclick="focusCourseItem(this)">

                                <div class="course-order" th:text="${item.courseOrder}">1</div>

                                <div class="thumb">
                                    <img th:if="${item.imageUrl != null and item.imageUrl != ''}"
                                         th:src="${item.imageUrl}"
                                         th:alt="${item.placeName}">
                                    <span th:if="${item.imageUrl == null or item.imageUrl == ''}">▧</span>
                                </div>

                                <div>
                                    <div class="place-name" th:text="${item.placeName}">장소명</div>
                                    <div class="place-meta">
                                        <span th:text="${item.category != null and item.category != '' ? item.category : '카테고리 정보 없음'}"></span>
                                        <br>
                                        <span th:text="${item.address != null and item.address != '' ? item.address : '주소 정보 없음'}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="day-block"
                         th:if="${#lists.contains(courseItems.![dayIndex], 2)}">
                        <h3 class="day-title">DAY 2</h3>

                        <div class="course-list">
                            <div class="course-item"
                                 th:each="item : ${courseItems}"
                                 th:if="${item.dayIndex == 2}"
                                 th:attr="
                                 data-title=${item.placeName},
                                 data-mapx=${item.mapx},
                                 data-mapy=${item.mapy},
                                 data-order=${item.courseOrder}
                                 "
                                 onclick="focusCourseItem(this)">

                                <div class="course-order" th:text="${item.courseOrder}">1</div>

                                <div class="thumb">
                                    <img th:if="${item.imageUrl != null and item.imageUrl != ''}"
                                         th:src="${item.imageUrl}"
                                         th:alt="${item.placeName}">
                                    <span th:if="${item.imageUrl == null or item.imageUrl == ''}">▧</span>
                                </div>

                                <div>
                                    <div class="place-name" th:text="${item.placeName}">장소명</div>
                                    <div class="place-meta">
                                        <span th:text="${item.category != null and item.category != '' ? item.category : '카테고리 정보 없음'}"></span>
                                        <br>
                                        <span th:text="${item.address != null and item.address != '' ? item.address : '주소 정보 없음'}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </section>

            <section class="glass-panel map-panel">
                <h2 class="section-title">코스 지도</h2>
                <div id="map"></div>
            </section>

        </div>

    </main>
</div>

<script th:src="@{'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverMapClientId}}"></script>

<script>
    let map;
    let markers = [];
    let infoWindows = [];

    window.onload = function () {
        const cards = document.querySelectorAll('.course-item');

        let centerPosition = new naver.maps.LatLng(37.8813153, 127.7299707);

        for (const card of cards) {
            const mapx = card.getAttribute('data-mapx');
            const mapy = card.getAttribute('data-mapy');

            if (mapx && mapy) {
                centerPosition = toLatLng(mapx, mapy);
                break;
            }
        }

        map = new naver.maps.Map('map', {
            center: centerPosition,
            zoom: 14,
            mapTypeControl: false,
            scaleControl: false,
            logoControl: false,
            mapDataControl: false,
            zoomControl: true,
            zoomControlOptions: {
                position: naver.maps.Position.RIGHT_CENTER
            }
        });

        drawCourseMarkers();
    };

    function toLatLng(mapx, mapy) {
        const lng = Number(mapx) / 10000000;
        const lat = Number(mapy) / 10000000;

        return new naver.maps.LatLng(lat, lng);
    }

    function drawCourseMarkers() {
        const cards = document.querySelectorAll('.course-item');

        cards.forEach(card => {
            const title = card.getAttribute('data-title');
            const mapx = card.getAttribute('data-mapx');
            const mapy = card.getAttribute('data-mapy');
            const order = card.getAttribute('data-order');

            if (!mapx || !mapy) {
                return;
            }

            const position = toLatLng(mapx, mapy);

            const marker = new naver.maps.Marker({
                position: position,
                map: map,
                title: title,
                icon: {
                    content:
                        '<div style="' +
                        'width:38px;height:38px;border-radius:50%;' +
                        'background:#f6c65b;color:#1e1606;' +
                        'display:grid;place-items:center;' +
                        'border:2px solid white;' +
                        'font-weight:950;font-size:14px;' +
                        'box-shadow:0 8px 18px rgba(246,198,91,.35);' +
                        '">' + order + '</div>',
                    size: new naver.maps.Size(38, 38),
                    anchor: new naver.maps.Point(19, 19)
                }
            });

            const infoWindow = new naver.maps.InfoWindow({
                content:
                    '<div style="padding:10px 14px;font-size:13px;font-weight:900;white-space:nowrap;' +
                    'background:rgba(30,35,36,.92);color:#fff;border-radius:10px;">'
                    + order + '. ' + escapeHtml(title)
                    + '</div>',
                borderWidth: 0,
                backgroundColor: "transparent",
                disableAnchor: true
            });

            naver.maps.Event.addListener(marker, 'click', function () {
                infoWindows.forEach(iw => iw.close());
                infoWindow.open(map, marker);
            });

            markers.push(marker);
            infoWindows.push(infoWindow);
        });

        fitMarkers();
    }

    function focusCourseItem(card) {
        if (!map) {
            return;
        }

        const mapx = card.getAttribute('data-mapx');
        const mapy = card.getAttribute('data-mapy');

        if (!mapx || !mapy) {
            return;
        }

        const position = toLatLng(mapx, mapy);

        map.setCenter(position);
        map.setZoom(16);

        const cards = Array.from(document.querySelectorAll('.course-item'));
        const index = cards.indexOf(card);

        if (markers[index] && infoWindows[index]) {
            infoWindows.forEach(iw => iw.close());
            infoWindows[index].open(map, markers[index]);
        }
    }

    function fitMarkers() {
        if (!map || markers.length === 0) {
            return;
        }

        const bounds = new naver.maps.LatLngBounds();

        markers.forEach(marker => {
            bounds.extend(marker.getPosition());
        });

        map.fitBounds(bounds);
    }

    function escapeHtml(value) {
        if (value == null) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>

</body>
</html>
