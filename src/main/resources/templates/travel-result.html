<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>FlowTrip - AI 추천 결과</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
            background: #f3f7fb;
            color: #0f172a;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 24px;
        }

        .layout {
            display: grid;
            grid-template-columns: 440px 1fr;
            gap: 24px;
        }

        .left {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        .label {
            font-size: 13px;
            color: #64748b;
            margin-top: 16px;
        }

        .value {
            margin-top: 6px;
            line-height: 1.6;
            font-weight: 600;
            word-break: break-word;
        }

        .place-list {
            max-height: 560px;
            overflow-y: auto;
        }

        .place-card {
            border: 1px solid #e5edf5;
            background: #f8fbff;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.15s;
        }

        .place-card:hover {
            background: #eff6ff;
            border-color: #93c5fd;
        }

        .place-card.selected {
            border-color: #2563eb;
            background: #eaf2ff;
        }

        .place-card strong {
            display: block;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .place-card p {
            margin: 4px 0;
            color: #64748b;
            font-size: 14px;
            line-height: 1.45;
        }

        .review-box {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #dbeafe;
        }

        .review-title {
            font-size: 13px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .review-item {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e5edf5;
        }

        .review-item a {
            display: block;
            color: #2563eb;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .review-item a:hover {
            text-decoration: underline;
        }

        .review-desc {
            color: #475569;
            font-size: 13px;
            line-height: 1.45;
            margin: 4px 0;
        }

        .review-meta {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 6px;
        }

        .map-card {
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            height: 720px;
            position: sticky;
            top: 24px;
        }

        #map {
            width: 100%;
            height: 720px;
        }

        .debug-card {
            margin-top: 24px;
            background: white;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 14px;
            padding: 18px;
            max-height: 420px;
            overflow-y: auto;
        }

        @media (max-width: 1100px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .map-card,
            #map {
                height: 500px;
            }

            .map-card {
                position: static;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="layout">

        <div class="left">

            <div class="card"
                 th:if="${recommendationResult != null}">

                <h2 th:text="${recommendationResult.recommendedPlaceName}">
                    추천 장소
                </h2>

                <div class="label">추천 테마</div>
                <div class="value"
                     th:text="${recommendationResult.selectedThemeName}">
                </div>

                <div class="label">추천 이유</div>
                <div class="value"
                     th:text="${recommendationResult.reason}">
                </div>

                <div class="label">주의사항</div>
                <div class="value"
                     th:text="${recommendationResult.caution}">
                </div>

                <div class="label">네이버 검색 기준어</div>
                <div class="value"
                     th:text="${naverSearchBaseQuery}">
                </div>

            </div>

            <div class="card"
                 id="targetPlaceData"
                 th:if="${targetPlaces != null and !targetPlaces.isEmpty()}"
                 th:attr="
                 data-title=${targetPlaces[0].title},
                 data-mapx=${targetPlaces[0].mapx},
                 data-mapy=${targetPlaces[0].mapy}
                 ">

                <h3>네이버 검색 결과</h3>

                <div class="label">장소명</div>
                <div class="value"
                     th:text="${targetPlaces[0].title}">
                </div>

                <div class="label">주소</div>
                <div class="value"
                     th:text="${targetPlaces[0].roadAddress != null && targetPlaces[0].roadAddress != '' ? targetPlaces[0].roadAddress : targetPlaces[0].address}">
                </div>

            </div>

            <div class="card">

                <h3>주변 식당 및 관련 후기</h3>

                <div class="place-list">

                    <div class="place-card"
                         th:each="item : ${restaurantReviews}"
                         th:attr="
                         data-title=${item.place.title},
                         data-mapx=${item.place.mapx},
                         data-mapy=${item.place.mapy}
                         ">

                        <strong th:text="${item.place.title}"></strong>

                        <p th:text="${item.place.category}"></p>

                        <p th:text="${item.place.roadAddress != null && item.place.roadAddress != '' ? item.place.roadAddress : item.place.address}">
                        </p>

                        <div class="review-box">

                            <div class="review-title">관련 블로그 후기</div>

                            <div th:if="${item.reviews == null or item.reviews.isEmpty()}">
                                <p class="review-desc">관련 후기를 찾지 못했습니다.</p>
                            </div>

                            <div class="review-item"
                                 th:each="review : ${item.reviews}">

                                <a th:href="${review.link}"
                                   target="_blank"
                                   onclick="event.stopPropagation();"
                                   th:text="${review.title}">
                                </a>

                                <p class="review-desc"
                                   th:text="${review.description}">
                                </p>

                                <p class="review-meta"
                                   th:text="${review.bloggerName + ' · ' + review.postDate}">
                                </p>

                            </div>

                        </div>

                    </div>

                    <p th:if="${restaurantReviews == null or restaurantReviews.isEmpty()}">
                        검색된 식당 정보가 없습니다.
                    </p>

                </div>

            </div>

        </div>

        <div class="map-card">
            <div id="map"></div>
        </div>

    </div>

    <div class="debug-card">

        <h3>AI 원본 응답</h3>

        <pre th:text="${gptResult}"></pre>

    </div>

</div>

<script th:src="@{'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverMapClientId}}"></script>

<script>

    let map;

    let mainMarker = null;
    let selectedMarker = null;

    let mainInfoWindow = null;
    let selectedInfoWindow = null;

    window.onload = function () {

        const target = document.getElementById('targetPlaceData');

        if (!target) {
            console.log("targetPlaceData 없음");
            return;
        }

        const title = target.getAttribute('data-title');
        const mapx = target.getAttribute('data-mapx');
        const mapy = target.getAttribute('data-mapy');

        console.log("추천 장소 title:", title);
        console.log("추천 장소 mapx:", mapx);
        console.log("추천 장소 mapy:", mapy);

        const lng = Number(mapx) / 10000000;
        const lat = Number(mapy) / 10000000;

        console.log("변환 lng:", lng);
        console.log("변환 lat:", lat);

        const position = new naver.maps.LatLng(lat, lng);

        map = new naver.maps.Map('map', {
            center: position,
            zoom: 16
        });

        drawMainPlaceMarker(title, position);

        bindRestaurantClickEvents();
        bindMainPlaceClickEvent();
    };

    function drawMainPlaceMarker(title, position) {

        if (mainMarker) {
            mainMarker.setMap(null);
        }

        mainMarker = new naver.maps.Marker({
            position: position,
            map: map,
            title: title
        });

        mainInfoWindow = new naver.maps.InfoWindow({
            content:
                '<div style="padding:10px;font-size:14px;font-weight:700;white-space:nowrap;">'
                + title +
                '</div>'
        });

        mainInfoWindow.open(map, mainMarker);

        map.setCenter(position);
        map.setZoom(16);

        console.log("추천 장소 마커 생성 완료");
    }

    function drawSelectedPlaceMarker(title, mapx, mapy) {

        const lng = Number(mapx) / 10000000;
        const lat = Number(mapy) / 10000000;

        console.log("업체 좌표 변환:", title, lat, lng);

        const position = new naver.maps.LatLng(lat, lng);

        if (selectedMarker) {
            selectedMarker.setMap(null);
        }

        if (selectedInfoWindow) {
            selectedInfoWindow.close();
        }

        selectedMarker = new naver.maps.Marker({
            position: position,
            map: map,
            title: title
        });

        selectedInfoWindow = new naver.maps.InfoWindow({
            content:
                '<div style="padding:10px;font-size:14px;font-weight:700;white-space:nowrap;">'
                + title +
                '</div>'
        });

        selectedInfoWindow.open(map, selectedMarker);

        map.setCenter(position);
        map.setZoom(17);

        console.log("주변 업체 마커 생성 완료:", title);
    }

    function bindRestaurantClickEvents() {

        const cards = document.querySelectorAll('.place-card');

        console.log("place-card 개수:", cards.length);

        cards.forEach(card => {

            card.addEventListener('click', function () {

                const title = card.getAttribute('data-title');
                const mapx = card.getAttribute('data-mapx');
                const mapy = card.getAttribute('data-mapy');

                console.log("클릭한 업체:", title);
                console.log("업체 mapx:", mapx);
                console.log("업체 mapy:", mapy);

                if (!mapx || !mapy) {
                    console.log("업체 좌표 없음");
                    return;
                }

                drawSelectedPlaceMarker(title, mapx, mapy);

                document.querySelectorAll('.place-card')
                    .forEach(el => el.classList.remove('selected'));

                card.classList.add('selected');
            });
        });
    }

    function bindMainPlaceClickEvent() {

        const target = document.getElementById('targetPlaceData');

        if (!target) {
            console.log("targetPlaceData 없음");
            return;
        }

        target.style.cursor = "pointer";

        target.addEventListener('click', function () {

            const title = target.getAttribute('data-title');
            const mapx = target.getAttribute('data-mapx');
            const mapy = target.getAttribute('data-mapy');

            const lng = Number(mapx) / 10000000;
            const lat = Number(mapy) / 10000000;

            const position = new naver.maps.LatLng(lat, lng);

            map.setCenter(position);
            map.setZoom(16);

            if (mainInfoWindow && mainMarker) {
                mainInfoWindow.open(map, mainMarker);
            }

            console.log("추천 장소로 복귀");
        });
    }

</script>

</body>
</html>
