<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FlowTrip - 공유 여행 코스</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * { box-sizing: border-box; }

        :root {
            --glass-dark: rgba(12, 18, 18, 0.54);
            --line: rgba(255, 255, 255, 0.14);
            --text: #f8fafc;
            --muted: rgba(248, 250, 252, 0.68);
            --dim: rgba(248, 250, 252, 0.45);
            --gold: #f6c65b;
            --green: #9be7c7;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
            color: var(--text);
            background:
                    linear-gradient(90deg, rgba(3, 9, 11, 0.82), rgba(3, 9, 11, 0.34), rgba(3, 9, 11, 0.62)),
                    url("/images/main-bg.jpg") center / cover no-repeat fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(circle at 75% 20%, rgba(246, 198, 91, 0.16), transparent 32%),
                    radial-gradient(circle at 18% 20%, rgba(67, 154, 181, 0.20), transparent 34%),
                    rgba(0, 0, 0, 0.12);
            pointer-events: none;
            z-index: -1;
        }

        a { color: inherit; text-decoration: none; }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 254px 1fr;
        }

        .sidebar {
            position: sticky;
            top: 0;
            min-height: 100vh;
            height: 100vh;
            padding: 28px 0;
            background: rgba(7, 18, 22, 0.52);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .brand {
            padding: 0 30px 32px;
            display: flex;
            align-items: center;
            gap: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.12);
            font-size: 24px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.7px;
        }

        .brand-sub {
            margin-top: 3px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
        }

        .side-menu {
            padding: 22px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .side-item {
            position: relative;
            height: 74px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--dim);
            font-size: 17px;
            font-weight: 700;
        }

        .side-item.active {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .side-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--gold);
            box-shadow: 0 0 18px rgba(246, 198, 91, 0.7);
        }

        .side-icon {
            width: 28px;
            text-align: center;
            font-size: 25px;
        }

        .content {
            padding: 44px 56px;
        }

        .page-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: -0.9px;
        }

        .desc {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
        }

        .head-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .primary-link,
        .outline-link {
            height: 46px;
            padding: 0 18px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 950;
        }

        .primary-link {
            color: #1e1606;
            background: linear-gradient(135deg, #f8d982, #dca73c);
            box-shadow: 0 14px 28px rgba(246, 198, 91, 0.18);
        }

        .outline-link {
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.07);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: minmax(360px, 0.72fr) minmax(520px, 1.28fr);
            gap: 28px;
            align-items: start;
        }

        .glass-panel {
            border-radius: 28px;
            padding: 26px;
            background: var(--glass-dark);
            border: 1px solid var(--line);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        }

        .section-title {
            margin: 0 0 18px;
            font-size: 24px;
            font-weight: 950;
        }

        .post-content {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.75;
            white-space: pre-line;
        }

        .meta-list {
            display: grid;
            gap: 12px;
            margin-top: 22px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
        }

        .meta-list b {
            color: var(--text);
            margin-right: 6px;
        }

        .author-link {
            color: var(--green);
            font-weight: 950;
        }

        .earned-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mini-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            padding: 0;
            border-radius: 50%;
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(246, 198, 91, 0.24);
            transition: transform 0.18s ease, border-color 0.18s ease;
        }

        .mini-badge:hover {
            transform: translateY(-3px);
            border-color: rgba(246, 198, 91, 0.62);
        }

        .mini-badge-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .badge-empty {
            color: var(--dim);
            font-size: 13px;
            font-weight: 800;
        }

        .day-block {
            margin-top: 24px;
        }

        .day-title {
            margin: 0 0 12px;
            color: var(--gold);
            font-size: 18px;
            font-weight: 950;
        }

        .course-list {
            display: grid;
            gap: 14px;
        }

        .course-item {
            display: grid;
            grid-template-columns: 42px 88px 1fr;
            gap: 16px;
            align-items: center;
            padding: 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09);
        }

        .course-order {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #1e1606;
            background: linear-gradient(135deg, #f8d982, #dca73c);
            font-weight: 950;
            font-size: 14px;
        }

        .thumb {
            width: 88px;
            height: 70px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255,255,255,0.12);
            display: grid;
            place-items: center;
            color: rgba(255,255,255,0.55);
            font-size: 28px;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .place-name {
            font-size: 17px;
            font-weight: 950;
            margin-bottom: 7px;
        }

        .place-meta {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
            font-weight: 650;
        }

        .empty {
            border-radius: 22px;
            padding: 28px;
            background: rgba(255,255,255,0.05);
            border: 1px dashed rgba(255,255,255,0.2);
            color: var(--muted);
            line-height: 1.7;
            text-align: center;
        }

        @media (max-width: 1280px) {
            .app { grid-template-columns: 220px 1fr; }
            .content { padding: 34px; }
            .detail-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 760px) {
            .app { display: block; }
            .sidebar { position: static; min-height: auto; height: auto; }
            .side-menu { display: none; }
            .content { padding: 24px; }
            .page-head { display: block; }
            .head-actions { margin-top: 20px; }
            .course-item { grid-template-columns: 38px 1fr; }
            .thumb { display: none; }
        }
    </style>
</head>

<body>

<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">✦</div>
            <div>
                <div class="brand-title">FlowTrip</div>
                <div class="brand-sub">AI 여행 추천 서비스</div>
            </div>
        </div>

        <nav class="side-menu">
            <a href="/travel-result/latest" class="side-item">
                <span class="side-icon">✦</span>
                <span>최근 추천</span>
            </a>
            <a href="/my-travel" class="side-item">
                <span class="side-icon">♡</span>
                <span>나의 여행</span>
            </a>
            <a href="/shared-travel" class="side-item active">
                <span class="side-icon">☷</span>
                <span>공유 게시판</span>
            </a>
        </nav>
    </aside>

    <main class="content">
        <div class="page-head">
            <div>
                <div class="eyebrow">SHARED COURSE</div>
                <h1 th:text="${post.title}">공유 여행 코스</h1>
                <p class="desc">
                    다른 여행자가 직접 구성한 DAY별 코스를 살펴보고 작성자의 테마 뱃지도 확인할 수 있습니다.
                </p>
            </div>

            <div class="head-actions">
                <a class="outline-link" href="/shared-travel">목록으로</a>
                <a class="primary-link"
                   th:if="${post.user != null}"
                   th:href="@{/shared-travel/users/{id}(id=${post.user.id})}">
                    작성자 프로필
                </a>
            </div>
        </div>

        <div class="detail-grid">
            <section class="glass-panel">
                <h2 class="section-title">공유 글</h2>

                <div class="post-content" th:text="${post.content}">
                    공유글 내용
                </div>

                <div class="meta-list">
                    <div>
                        <b>작성자</b>
                        <a class="author-link"
                           th:if="${post.user != null}"
                           th:href="@{/shared-travel/users/{id}(id=${post.user.id})}"
                           th:text="${post.user.nickname != null and post.user.nickname != '' ? post.user.nickname : post.user.username}">
                            닉네임
                        </a>
                        <span th:if="${post.user == null}">알 수 없음</span>
                    </div>
                    <div>
                        <b>조회수</b>
                        <span th:text="${post.viewCount}">0</span>
                    </div>
                    <div>
                        <b>작성일</b>
                        <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}">2026.05.22</span>
                    </div>
                    <div>
                        <b>기간</b>
                        <span th:text="${travelPlan.startDate != null ? #temporals.format(travelPlan.startDate, 'yyyy.MM.dd') : '-'}"></span>
                        ~
                        <span th:text="${travelPlan.endDate != null ? #temporals.format(travelPlan.endDate, 'yyyy.MM.dd') : '-'}"></span>
                    </div>
                    <div>
                        <b>추천 테마</b>
                        <span th:text="${travelPlan.selectedThemeName != null and travelPlan.selectedThemeName != '' ? travelPlan.selectedThemeName : '-'}"></span>
                    </div>
                    <div>
                        <b>대표 장소</b>
                        <span th:text="${travelPlan.recommendedPlaceName != null and travelPlan.recommendedPlaceName != '' ? travelPlan.recommendedPlaceName : '-'}"></span>
                    </div>
                    <div>
                        <b>동행 / 이동</b>
                        <span th:text="${travelPlan.companion != null and travelPlan.companion != '' ? travelPlan.companion : '-'}"></span>
                        ·
                        <span th:text="${travelPlan.transport != null and travelPlan.transport != '' ? travelPlan.transport : '-'}"></span>
                    </div>
                </div>

                <div class="earned-badges">
                    <a class="mini-badge"
                       th:each="badge : ${earnedBadges}"
                       th:title="${badge.name}"
                       th:href="@{/shared-travel/users/{id}(id=${post.user.id})}">
                        <img class="mini-badge-img"
                             th:src="${badge.imagePath}"
                             th:alt="${badge.name}">
                    </a>

                    <span class="badge-empty"
                          th:if="${earnedBadges == null or earnedBadges.isEmpty()}">
                        아직 획득한 뱃지가 없습니다.
                    </span>
                </div>
            </section>

            <section class="glass-panel">
                <h2 class="section-title">공유된 DAY별 여행 코스</h2>

                <div th:if="${courseItems == null or courseItems.isEmpty()}" class="empty">
                    저장된 코스가 없습니다.
                </div>

                <div th:if="${courseItems != null and !courseItems.isEmpty()}">
                    <div th:each="day : ${#numbers.sequence(1, dayCount)}"
                         class="day-block">
                        <h3 class="day-title" th:text="'DAY ' + ${day}">DAY 1</h3>

                        <div class="course-list">
                            <div class="course-item"
                                 th:each="item : ${courseItems}"
                                 th:if="${(item.dayIndex == null and day == 1) or item.dayIndex == day}">
                                <div class="course-order" th:text="${item.courseOrder}">1</div>

                                <div class="thumb">
                                    <img th:if="${item.imageUrl != null and item.imageUrl != ''}"
                                         th:src="${item.imageUrl}"
                                         th:alt="${item.placeName}">
                                    <span th:if="${item.imageUrl == null or item.imageUrl == ''}">▧</span>
                                </div>

                                <div>
                                    <div class="place-name" th:text="${item.placeName}">장소명</div>
                                    <div class="place-meta">
                                        <span th:text="${item.category != null and item.category != '' ? item.category : '카테고리 정보 없음'}"></span>
                                        <br>
                                        <span th:text="${item.address != null and item.address != '' ? item.address : '주소 정보 없음'}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>

</body>
</html>
