<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FlowTrip - 여행 조건 입력</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg1: #edf7ff;
            --bg2: #f8fbff;
            --bg3: #eefbf4;
            --card: rgba(255, 255, 255, 0.94);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --line: #dbe7f3;
            --soft-line: #e6eef7;
            --primary: #2563eb;
            --primary-2: #0ea5e9;
            --chip-bg: #f8fbff;
            --chip-hover: #eef6ff;
            --error: #dc2626;
            --shadow: 0 24px 60px rgba(55, 100, 140, 0.14);
        }

        body {
            margin: 0;
            font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
            color: var(--text-main);
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
            min-height: 100vh;
        }
		

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 36px 18px;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .subtitle {
            margin: 0 0 34px;
            color: var(--text-sub);
            font-size: 16px;
            line-height: 1.65;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            margin-bottom: 2px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .section-card {
            border: 1px solid var(--soft-line);
            background: rgba(248, 251, 255, 0.72);
            border-radius: 20px;
            padding: 22px 20px;
        }

        .section-title {
            margin: 0 0 14px;
            font-size: 15px;
            font-weight: 800;
            color: #1e293b;
        }

        label.field-title {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
        }

        input[type="date"],
        select {
            width: 100%;
            height: 50px;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 0 14px;
            background: #fff;
            font-size: 15px;
            color: #111827;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="date"]:focus,
        select:focus {
            border-color: #7cb6ff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .option-group label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid #e2ebf5;
            background: var(--chip-bg);
            font-size: 14px;
            color: #1f2937;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .option-group label:hover {
            background: var(--chip-hover);
            border-color: #b8d4ff;
            transform: translateY(-1px);
        }

        .option-group input {
            accent-color: var(--primary);
        }

        .error {
            margin-top: 8px;
            font-size: 13px;
            color: var(--error);
        }

        .submit-wrap {
            margin-top: 8px;
        }

        .submit-btn {
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.22);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 30px rgba(37, 99, 235, 0.26);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .helper {
            margin-top: 10px;
            font-size: 13px;
            color: #7b8aa0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                padding: 26px 18px;
                border-radius: 22px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .option-group {
                gap: 10px;
            }

            .option-group label {
                width: 100%;
                justify-content: flex-start;
            }
			textarea {
			    width: 100%;
			    border: 1px solid #dbe7f3;
			    border-radius: 14px;
			    padding: 14px;
			    font-size: 15px;
			    font-family: inherit;
			    background: #ffffff;
			    color: #111827;
			    resize: vertical;
			    outline: none;
			    transition: all 0.2s ease;
			}

			textarea:focus {
			    border-color: #7cb6ff;
			    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
			}
        }
		
    </style>
</head>
<body>
<div class="page">
    <div class="container">
        <div class="brand">FLOWTRIP</div>
        <h1>여행 조건 입력</h1>
        <p class="subtitle">
            여행 일정과 선호 조건을 입력하면<br>
            데이터 기반으로 가장 어울리는 여행 테마를 추천합니다.
        </p>

        <form th:action="@{/submit}" th:object="${travelRequestDto}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label class="field-title" for="startDate">여행 시작일</label>
                    <input type="date" id="startDate" th:field="*{startDate}">
                    <div class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                </div>

                <div class="form-group">
                    <label class="field-title" for="endDate">여행 종료일</label>
                    <input type="date" id="endDate" th:field="*{endDate}">
                    <div class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
                </div>

                <div class="form-group full-width section-card">
                    <div class="section-title">여행 스타일 설정</div>

                    <label class="field-title">액티비티 정도</label>
                    <div class="option-group">
                        <label><input type="radio" th:field="*{activityLevel}" value="낮음"> 낮음</label>
                        <label><input type="radio" th:field="*{activityLevel}" value="중간"> 중간</label>
                        <label><input type="radio" th:field="*{activityLevel}" value="높음"> 높음</label>
                    </div>
                    <div class="error" th:if="${#fields.hasErrors('activityLevel')}" th:errors="*{activityLevel}"></div>
                </div>

                <div class="form-group full-width section-card">
                    <div class="section-title">여행 동반 및 이동 정보</div>

                    <label class="field-title">동행 유형</label>
                    <div class="option-group">
                        <label><input type="radio" th:field="*{companion}" value="혼자"> 혼자</label>
                        <label><input type="radio" th:field="*{companion}" value="친구"> 친구</label>
                        <label><input type="radio" th:field="*{companion}" value="연인"> 연인</label>
                        <label><input type="radio" th:field="*{companion}" value="가족"> 가족</label>
                    </div>
                    <div class="error" th:if="${#fields.hasErrors('companion')}" th:errors="*{companion}"></div>

                    <div style="height: 16px;"></div>

                    <label class="field-title">이동수단</label>
                    <div class="option-group">
                        <label><input type="radio" th:field="*{transport}" value="자차"> 자차</label>
                        <label><input type="radio" th:field="*{transport}" value="대중교통"> 대중교통</label>
                        <label><input type="radio" th:field="*{transport}" value="도보"> 도보/뚜벅이</label>
                    </div>
                    <div class="error" th:if="${#fields.hasErrors('transport')}" th:errors="*{transport}"></div>
                </div>

                <div class="form-group full-width">
                    <label class="field-title" for="moodGroup">여행 무드</label>
                    <select id="moodGroup" th:field="*{moodGroup}">
                        <option value="">-- 여행 무드를 선택하세요 --</option>
                        <option th:each="mood : ${moodGroups}"
                                th:value="${mood}"
                                th:text="${mood}">
                        </option>
                    </select>
                    <div class="error" th:if="${#fields.hasErrors('moodGroup')}" th:errors="*{moodGroup}"></div>
                </div>
				
				<div class="form-group full-width">
				    <label class="field-title" for="specialRequest">특이사항</label>
				    <textarea id="specialRequest"
				              th:field="*{specialRequest}"
				              rows="5"
				              placeholder="예: 부모님과 함께 가서 많이 걷는 코스는 피하고 싶어요. 사진 찍기 좋은 조용한 장소면 좋겠습니다."></textarea>
				</div>

                <div class="submit-wrap full-width">
                    <button type="submit" class="submit-btn">테마 추천 받기</button>
                    <div class="helper">무드는 데이터베이스에 등록된 테마 기준으로 자동 제공됩니다.</div>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
