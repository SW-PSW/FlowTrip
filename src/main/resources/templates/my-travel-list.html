<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FlowTrip - 나의 여행</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --glass-dark: rgba(12, 18, 18, 0.54);
            --line: rgba(255, 255, 255, 0.14);
            --text: #f8fafc;
            --muted: rgba(248, 250, 252, 0.68);
            --dim: rgba(248, 250, 252, 0.45);
            --gold: #f6c65b;
            --green: #9be7c7;
            --danger: #ff6b6b;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
            color: var(--text);
            background:
                    linear-gradient(90deg, rgba(3, 9, 11, 0.82), rgba(3, 9, 11, 0.34), rgba(3, 9, 11, 0.62)),
                    url("/images/main-bg.jpg") center / cover no-repeat fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(circle at 75% 20%, rgba(246, 198, 91, 0.16), transparent 32%),
                    radial-gradient(circle at 18% 20%, rgba(67, 154, 181, 0.20), transparent 34%),
                    rgba(0, 0, 0, 0.12);
            pointer-events: none;
            z-index: -1;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 254px 1fr;
        }

        .sidebar {
            min-height: 100vh;
            padding: 28px 0;
            background: rgba(7, 18, 22, 0.52);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            display: flex;
            flex-direction: column;
        }

        .brand {
            padding: 0 30px 32px;
            display: flex;
            align-items: center;
            gap: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.12);
            font-size: 24px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.7px;
        }

        .brand-sub {
            margin-top: 3px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
        }

        .side-menu {
            padding: 22px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .side-item {
            position: relative;
            height: 74px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--dim);
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
        }

        .side-item.active {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .side-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--gold);
            box-shadow: 0 0 18px rgba(246, 198, 91, 0.7);
        }

        .side-icon {
            width: 28px;
            text-align: center;
            font-size: 25px;
        }

        .content {
            padding: 44px 56px;
        }

        .page-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--gold);
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: -0.9px;
        }

        .desc {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
        }

        .primary-link {
            height: 46px;
            padding: 0 18px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1e1606;
            background: linear-gradient(135deg, #f8d982, #dca73c);
            font-size: 14px;
            font-weight: 950;
            box-shadow: 0 14px 28px rgba(246, 198, 91, 0.18);
        }

        .travel-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(260px, 1fr));
            gap: 22px;
        }

        .travel-card {
            min-height: 250px;
            border-radius: 28px;
            padding: 24px;
            background: var(--glass-dark);
            border: 1px solid var(--line);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
            display: flex;
            flex-direction: column;
            transition: 0.18s ease;
        }

        .travel-card:hover {
            transform: translateY(-4px);
            background: rgba(20, 28, 29, 0.62);
            border-color: rgba(246, 198, 91, 0.32);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .badge {
            min-height: 32px;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(246, 198, 91, 0.13);
            border: 1px solid rgba(246, 198, 91, 0.24);
            color: var(--gold);
            font-size: 12px;
            font-weight: 900;
        }

        .date {
            color: var(--dim);
            font-size: 12px;
            font-weight: 800;
        }

        .card-title {
            margin: 0;
            font-size: 23px;
            font-weight: 950;
            letter-spacing: -0.5px;
            line-height: 1.35;
        }

        .meta-list {
            margin: 18px 0;
            display: grid;
            gap: 8px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.45;
        }

        .memo {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--dim);
            font-size: 13px;
            line-height: 1.55;
        }

        .empty {
            border-radius: 30px;
            padding: 46px;
            background: var(--glass-dark);
            border: 1px dashed rgba(255, 255, 255, 0.22);
            color: var(--muted);
            text-align: center;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .empty h2 {
            margin: 0 0 12px;
            color: var(--text);
            font-size: 25px;
        }

        .empty p {
            margin: 0 0 22px;
            line-height: 1.7;
        }

        @media (max-width: 1280px) {
            .app {
                grid-template-columns: 220px 1fr;
            }

            .content {
                padding: 34px;
            }

            .travel-grid {
                grid-template-columns: repeat(2, minmax(240px, 1fr));
            }
        }

        @media (max-width: 760px) {
            .app {
                display: block;
            }

            .sidebar {
                min-height: auto;
            }

            .side-menu {
                display: none;
            }

            .content {
                padding: 24px;
            }

            .page-head {
                display: block;
            }

            .primary-link {
                margin-top: 20px;
            }

            .travel-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">✦</div>
            <div>
                <div class="brand-title">FlowTrip</div>
                <div class="brand-sub">AI 여행 추천 서비스</div>
            </div>
        </div>

        <nav class="side-menu">
            <a href="/travel-result/latest" class="side-item">
                <span class="side-icon">✦</span>
                <span>최근 추천</span>
            </a>

            <a href="/my-travel" class="side-item active">
                <span class="side-icon">♡</span>
                <span>나의 여행</span>
            </a>

            <a href="/shared-travel" class="side-item">
                <span class="side-icon">☷</span>
                <span>공유 게시판</span>
            </a>
        </nav>
    </aside>

    <main class="content">
        <div class="page-head">
            <div>
                <div class="eyebrow">MY FLOWTRIP</div>
                <h1>나의 여행 코스</h1>
                <p class="desc">
                    AI 추천 결과를 바탕으로 저장한 여행 코스를 다시 확인할 수 있습니다.
                </p>
            </div>

            <a class="primary-link" href="/travel-result/latest">최근 추천으로 돌아가기</a>
        </div>

        <div th:if="${travelPlans == null or travelPlans.isEmpty()}" class="empty">
            <h2>아직 저장된 여행 코스가 없습니다.</h2>
            <p>
                여행지를 추천받고 주변 식당, 카페, 숙소를 일정에 추가한 뒤<br>
                코스 저장 버튼을 눌러 나만의 여행을 만들어보세요.
            </p>
            <a class="primary-link" href="/">여행 추천 시작하기</a>
        </div>

        <div th:if="${travelPlans != null and !travelPlans.isEmpty()}" class="travel-grid">
            <a class="travel-card"
               th:each="plan : ${travelPlans}"
               th:href="@{/my-travel/{id}(id=${plan.id})}">

                <div class="card-top">
                    <span class="badge"
                          th:text="${plan.moodGroup != null and plan.moodGroup != '' ? plan.moodGroup : 'FlowTrip'}">
                        FlowTrip
                    </span>
                    <span class="date"
                          th:text="${#temporals.format(plan.createdAt, 'yyyy.MM.dd')}">
                        2026.05.16
                    </span>
                </div>

                <h2 class="card-title"
                    th:text="${plan.title != null and plan.title != '' ? plan.title : '나의 여행 코스'}">
                    나의 여행 코스
                </h2>

                <div class="meta-list">
                    <div>
                        기간:
                        <span th:text="${plan.startDate != null ? #temporals.format(plan.startDate, 'yyyy.MM.dd') : '-'}"></span>
                        ~
                        <span th:text="${plan.endDate != null ? #temporals.format(plan.endDate, 'yyyy.MM.dd') : '-'}"></span>
                    </div>

                    <div>
                        테마:
                        <span th:text="${plan.selectedThemeName != null and plan.selectedThemeName != '' ? plan.selectedThemeName : '-'}"></span>
                    </div>

                    <div>
                        추천지:
                        <span th:text="${plan.recommendedPlaceName != null and plan.recommendedPlaceName != '' ? plan.recommendedPlaceName : '-'}"></span>
                    </div>

                    <div>
                        동행:
                        <span th:text="${plan.companion != null and plan.companion != '' ? plan.companion : '-'}"></span>
                        · 이동:
                        <span th:text="${plan.transport != null and plan.transport != '' ? plan.transport : '-'}"></span>
                    </div>
                </div>

                <div class="memo"
                     th:text="${plan.memo != null and plan.memo != '' ? plan.memo : '저장된 여행 코스입니다.'}">
                    저장된 여행 코스입니다.
                </div>
            </a>
        </div>
    </main>
</div>

</body>
</html>
